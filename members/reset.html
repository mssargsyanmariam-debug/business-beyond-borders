<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password | Business Beyond Borders</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D152C">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Noto+Sans+Armenian:wght@400..800&display=swap">
  <link rel="stylesheet" href="../assets/css/styles.css?v=12">
</head>
<body data-page="members" data-member="reset" data-fixed-meta>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header site-header--slim">
    <div class="container header-inner">
      <a class="brand" href="../" aria-label="Business Beyond Borders, home">
        <svg class="brand__mark" aria-hidden="true"><use href="#i-globe"/></svg>
        <span class="brand__text"><b>B</b>usiness <b>B</b>eyond <b>B</b>orders</span>
      </a>
      <div class="header-actions">
        <div class="lang-picker">
          <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
          <label class="sr-only" for="lang-select" data-i18n="nav.lang">Change language</label>
          <select id="lang-select" data-lang-select>
            <option value="en" lang="en">English</option>
            <option value="hy" lang="hy">Հայերեն</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="ru" lang="ru">Русский</option>
            <option value="es" lang="es">Español</option>
            <option value="fr" lang="fr">Français</option>
            <option value="zh" lang="zh">中文</option>
            <option value="vi" lang="vi">Tiếng Việt</option>
            <option value="ar" lang="ar">العربية</option>
          </select>
        </div>
        <a class="btn btn--ghost btn--sm" href="login.html" data-i18n="login.title">Member login</a>
      </div>
    </div>
  </header>

  <main id="main" class="member-main">
    <div class="container container--narrow">
      <div class="member-panel member-panel--center" data-members-soon hidden>
        <h1 data-i18n="members.soon.title">The member area opens soon</h1>
        <p data-i18n="members.soon.text">We are finishing the last step of the set-up.</p>
      </div>

      <div data-needs-supabase>
        <h1 class="member-title" data-i18n="reset.title">Set a new password</h1>
        <div class="member-panel">
          <form data-form="reset" novalidate>
            <div class="field">
              <label for="reset-password" data-i18n="reset.password">New password</label>
              <input id="reset-password" name="password" type="password" autocomplete="new-password" required>
              <p class="field-hint" data-i18n="login.hint.password">At least 8 characters.</p>
            </div>
            <div class="field">
              <label for="reset-password2" data-i18n="reset.repeat">Repeat the new password</label>
              <input id="reset-password2" name="password2" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn btn--primary btn--block" type="submit" data-i18n="reset.submit">Save new password</button>
          </form>
          <p class="form-status" data-reset-status role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© <span data-year>2026</span> Business Beyond Borders.
        <a href="../privacy.html" data-i18n="footer.privacy">Privacy</a> ·
        <a href="../terms.html" data-i18n="footer.terms">Terms</a>
      </p>
    </div>
  </footer>

  <script>window.BBB_CONTENT_URL = "../content.json";</script>
  <script src="../assets/js/sprite.js?v=12"></script>
  <script src="../assets/js/lang/en.js?v=12"></script>
  <script src="../assets/js/lang/hy.js?v=12"></script>
  <script src="../assets/js/lang/de.js?v=12"></script>
  <script src="../assets/js/lang/ru.js?v=12"></script>
  <script src="../assets/js/lang/es.js?v=12"></script>
  <script src="../assets/js/lang/fr.js?v=12"></script>
  <script src="../assets/js/lang/zh.js?v=12"></script>
  <script src="../assets/js/lang/vi.js?v=12"></script>
  <script src="../assets/js/lang/ar.js?v=12"></script>
  <script src="../assets/js/main.js?v=12"></script>
  <script src="../assets/js/members-config.js?v=12"></script>
  <script type="module" src="../assets/js/members.js?v=12"></script>
</body>
</html>
